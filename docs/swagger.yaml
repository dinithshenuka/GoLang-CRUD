basePath: /
definitions:
  errors.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  models.BookResponse:
    properties:
      authorId:
        type: string
      bookId:
        type: string
      description:
        type: string
      genre:
        type: string
      isbn:
        type: string
      pages:
        type: integer
      price:
        type: number
      publicationDate:
        type: string
      publisherId:
        type: string
      quantity:
        minimum: 0
        type: integer
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - authorId
    - bookId
    - description
    - genre
    - isbn
    - pages
    - price
    - publicationDate
    - publisherId
    - quantity
    - title
    type: object
  models.CreateBookRequest:
    properties:
      authorId:
        type: string
      description:
        type: string
      genre:
        type: string
      isbn:
        type: string
      pages:
        type: integer
      price:
        type: number
      publicationDate:
        type: string
      publisherId:
        type: string
      quantity:
        minimum: 0
        type: integer
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - authorId
    - description
    - genre
    - isbn
    - pages
    - price
    - publicationDate
    - publisherId
    - quantity
    - title
    type: object
  models.UpdateBookRequest:
    properties:
      authorId:
        type: string
      description:
        type: string
      genre:
        type: string
      isbn:
        type: string
      pages:
        type: integer
      price:
        type: number
      publicationDate:
        type: string
      publisherId:
        type: string
      quantity:
        minimum: 0
        type: integer
      title:
        maxLength: 255
        minLength: 1
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A RESTful API for managing books with CRUD operations
  title: Book API
  version: "1.0"
paths:
  /books:
    get:
      consumes:
      - application/json
      description: Get a list of all books
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BookResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Get all books
      tags:
      - books
    post:
      consumes:
      - application/json
      description: Create a new book with the provided data
      parameters:
      - description: Book data
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/models.CreateBookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Create a new book
      tags:
      - books
  /books/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a book with the specified ID
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Delete a book
      tags:
      - books
    get:
      consumes:
      - application/json
      description: Get a book by its ID
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Get a book by ID
      tags:
      - books
    put:
      consumes:
      - application/json
      description: Update a book with the specified ID
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: string
      - description: Book data
        in: body
        name: book
        required: true
        schema:
          $ref: '#/definitions/models.UpdateBookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Update a book
      tags:
      - books
  /books/search:
    get:
      consumes:
      - application/json
      description: Search books by keyword in title and description
      parameters:
      - description: Search keyword
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BookResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Search books
      tags:
      - books
schemes:
- http
swagger: "2.0"
