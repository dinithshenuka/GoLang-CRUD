version: '3.8'

services:
  api:
    build: .
    container_name: book-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - LOG_LEVEL=info
    volumes:
      - book_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/books"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  book_data:
    name: book-api-data